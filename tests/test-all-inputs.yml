name: Test - All Inputs Specified
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-2
          client-request-token: my-unique-token-12345
          source-s3-bucket: my-source-bucket
          source-s3-key: functions/my-lambda.zip
          source-s3-version: v1abc123
          destination-s3-bucket: my-dest-bucket
          destination-s3-prefix: signed/production/
          profile-name: my-signing-profile
          profile-owner: '123456789012'
          rename-signed-object: 'false'
          wait-until-successful: 'false'
          max-wait-time: '10'

      - name: Assert action ran and inputs were accepted
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With no/fake AWS credentials, the action should fail at the AWS API call
          # The action should NOT crash before reaching the AWS call (input parsing must succeed)
          # Accept both failure (expected with no/fake creds) and success
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
