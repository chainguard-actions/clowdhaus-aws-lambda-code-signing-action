name: Test with all optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with all optional inputs specified
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: ap-southeast-2
        with:
          aws-region: ap-southeast-2
          client-request-token: "unique-token-12345"
          source-s3-bucket: source-bucket-ap
          source-s3-key: releases/v1.0.0/function.zip
          source-s3-version: "xyz789"
          destination-s3-bucket: dest-bucket-ap
          destination-s3-prefix: "signed-releases/"
          profile-name: ap-signing-profile
          profile-owner: "123456789012"
          rename-signed-object: "true"
          wait-until-successful: "true"
          max-wait-time: "60"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all optional inputs, outcome: $OUTCOME"
