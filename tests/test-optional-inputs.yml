name: Test - Optional Inputs Handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        with:
          aws-region: ap-southeast-2
          client-request-token: "unique-token-12345"
          source-s3-bucket: source-bucket-optional-test
          source-s3-key: lambdas/handler.zip
          source-s3-version: "v2"
          destination-s3-bucket: destination-bucket-optional-test
          destination-s3-prefix: "artifacts/signed/"
          profile-name: my-signing-profile
          profile-owner: "123456789012"
          rename-signed-object: "false"
          wait-until-successful: "false"
          max-wait-time: "60"

      - name: Assert action failed at AWS API call (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no valid AWS credentials.
          # This test verifies that all optional inputs are accepted without
          # causing input parsing errors.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no AWS credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted all optional inputs and failed at AWS API call"
