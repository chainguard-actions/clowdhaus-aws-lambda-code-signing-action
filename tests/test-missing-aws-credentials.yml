name: Test - Missing AWS Credentials Error Handling
on:
  workflow_dispatch:

jobs:
  test-missing-credentials:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action and expect failure due to invalid AWS credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          source-s3-bucket: my-source-bucket
          source-s3-key: my-function.zip
          source-s3-version: "1"
          destination-s3-bucket: my-dest-bucket
          profile-name: my-signing-profile
          wait-until-successful: "false"

      - name: Assert action failed (expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid AWS credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when AWS credentials are invalid"
