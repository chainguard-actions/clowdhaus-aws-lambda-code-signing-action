name: Test - Missing AWS Credentials Error Handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          source-s3-bucket: my-test-source-bucket
          source-s3-key: my-lambda-function.zip
          source-s3-version: abc123version
          destination-s3-bucket: my-test-dest-bucket
          destination-s3-prefix: signed/
          profile-name: my-signing-profile
          wait-until-successful: 'false'
          rename-signed-object: 'false'
          max-wait-time: '10'

      - name: Assert action failed due to missing credentials
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # Without valid AWS credentials, the action should fail at the AWS API call
          # Accept failure (expected) or success (if ambient credentials exist)
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
