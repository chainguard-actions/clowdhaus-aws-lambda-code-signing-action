name: Test - AWS error on missing credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires real AWS credentials to call the Signer API.
      # Without credentials, it should fail with an AWS auth/credentials error,
      # NOT an input-parsing error. This confirms inputs are parsed correctly
      # and the action reaches the AWS API call stage.
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-2
        with:
          aws-region: us-east-2
          source-s3-bucket: my-source-bucket
          source-s3-key: my-lambda-function.zip
          source-s3-version: "1"
          destination-s3-bucket: my-destination-bucket
          destination-s3-prefix: signed/
          profile-name: my-signing-profile
          rename-signed-object: "false"
          wait-until-successful: "false"

      - name: Assert action failed (expected - no real AWS credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing/invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed as expected (no real AWS credentials)"

      - name: Assert no job-id output (action failed before producing output)
        env:
          JOB_ID: ${{ steps.action.outputs.job-id }}
        run: |
          echo "job-id: '$JOB_ID'"
          if [ -n "$JOB_ID" ]; then
            echo "FAIL: expected no job-id output when action fails"
            exit 1
          fi
          echo "PASS: no job-id output as expected"
