name: Test invocation with default optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      # Provide fake AWS credentials so the SDK initializes
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with minimal required inputs (defaults for optional)
        id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          source-s3-bucket: source-bucket-example
          source-s3-key: functions/my-function.zip
          source-s3-version: v1
          destination-s3-bucket: dest-bucket-example
          profile-name: lambda-signing-profile
          # Omitting optional inputs to test defaults:
          # destination-s3-prefix defaults to 'signed/'
          # rename-signed-object defaults to 'true'
          # wait-until-successful defaults to 'true'
          # max-wait-time defaults to '30'

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the AWS API call (invalid credentials),
          # not at input validation. Both 'success' and 'failure' are acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with default optional inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
