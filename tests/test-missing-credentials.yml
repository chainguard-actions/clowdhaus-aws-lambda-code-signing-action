name: Test - Missing AWS Credentials Error Handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clear any AWS credentials from environment
        run: |
          unset AWS_ACCESS_KEY_ID || true
          unset AWS_SECRET_ACCESS_KEY || true
          unset AWS_SESSION_TOKEN || true
          echo "AWS credentials cleared (if any were set)"

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        with:
          aws-region: us-east-1
          source-s3-bucket: my-test-source-bucket
          source-s3-key: my-lambda-function.zip
          source-s3-version: "1"
          destination-s3-bucket: my-test-destination-bucket
          destination-s3-prefix: signed/
          profile-name: my-signing-profile
          wait-until-successful: "false"
          rename-signed-object: "false"

      - name: Assert action failed (expected - no AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without AWS credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without AWS credentials"
