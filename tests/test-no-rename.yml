name: Test with rename-signed-object disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with rename-signed-object set to false
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: eu-west-1
        with:
          aws-region: eu-west-1
          source-s3-bucket: source-bucket-eu
          source-s3-key: artifacts/lambda-package.zip
          source-s3-version: "v2"
          destination-s3-bucket: dest-bucket-eu
          destination-s3-prefix: "output/"
          profile-name: my-eu-signing-profile
          rename-signed-object: "false"
          wait-until-successful: "false"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with rename-signed-object=false, outcome: $OUTCOME"
