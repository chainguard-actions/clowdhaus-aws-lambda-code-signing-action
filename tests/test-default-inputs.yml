name: Test - Default Input Values
on:
  workflow_dispatch:

jobs:
  test-default-inputs:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with fake credentials and default inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          aws-region: us-east-1
          source-s3-bucket: my-source-bucket
          source-s3-key: functions/my-function.zip
          source-s3-version: "abc123"
          destination-s3-bucket: my-dest-bucket
          profile-name: my-signing-profile
          # destination-s3-prefix defaults to 'signed/'
          # rename-signed-object defaults to 'true'
          # wait-until-successful defaults to 'true'
          # max-wait-time defaults to '30'

      - name: Assert action ran (failed at AWS API level, not at startup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials, the action should fail at the AWS API call,
          # not at startup/input parsing. Either failure or success is acceptable
          # as long as the action actually ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure at AWS API level)"
