name: Test - Default Input Values and Input Parsing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        with:
          aws-region: eu-west-1
          source-s3-bucket: source-bucket-test
          source-s3-key: functions/my-lambda.zip
          source-s3-version: "abc123version"
          destination-s3-bucket: destination-bucket-test
          # destination-s3-prefix uses default: 'signed/'
          profile-name: my-lambda-signing-profile
          # wait-until-successful uses default: 'true'
          # rename-signed-object uses default: 'true'
          # max-wait-time uses default: '30'

      - name: Assert action failed at AWS API call (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there are no valid AWS credentials,
          # not because of input parsing errors. Either way, the outcome is 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no AWS credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (at AWS API call, not input parsing)"
